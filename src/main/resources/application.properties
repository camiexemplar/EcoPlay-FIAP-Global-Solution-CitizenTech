spring.application.name=EcoPlay

# Oracle
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# HikariCP
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1

# JPA / Hibernate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=validate

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# RabbitMQ
management.health.rabbit.enabled=false

# JWT
app.jwt.private-key=file:${JWT_PRIVATE_KEY_PATH:./keys/private_key.pem}
app.jwt.public-key=file:${JWT_PUBLIC_KEY_PATH:./keys/public_key.pem}
app.jwt.issuer=${JWT_ISSUER:ecoplay-api}
app.jwt.audience=${JWT_AUDIENCE:ecoplay-services}

# Integração com a classificação Python e a gamificação .NET
integration.ai.base-url=${AI_API_BASE_URL:http://localhost:8000}
integration.dotnet.base-url=${DOTNET_API_BASE_URL:${GAMIFICACAO_URL:http://localhost:5033}}
integration.dotnet.issuer=${DOTNET_JWT_ISSUER:${JWT_ISSUER:ecoplay-api}}
integration.dotnet.audience=${DOTNET_JWT_AUDIENCE:${JWT_AUDIENCE:ecoplay-services}}

# IA generativa via Spring AI / Gemini. Configure GOOGLE_API_KEY apenas no ambiente.
spring.ai.model.chat=${SPRING_AI_MODEL_CHAT:none}
spring.ai.google.genai.api-key=${GOOGLE_API_KEY:}
spring.ai.google.genai.chat.model=${GEMINI_MODEL:gemini-3.6-flash}

# O serviço Python aceita imagens de até 10 MiB
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Servidor
server.port=8080
